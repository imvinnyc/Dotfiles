#################################
#           General             #
#################################

# Backend + sync
backend        = "glx";
vsync          = true;
use-damage     = true;

# Experimental animations
animations               = true;
animation-stiffness      = 120;
animation-window-mass    = 0.8;

#################################
#   Shadows, Fade, Opacity       #
#################################

shadow          = true;
shadow-radius   = 12;
shadow-opacity  = 0.75;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-color    = "#000000";
crop-shadow-to-monitor = false;

fading          = true;
fade-in-step    = 0.03;
fade-out-step   = 0.03;
no-fading-openclose = false;

frame-opacity       = 0.90;
inactive-dim-fixed  = true;

#################################
#         Rounded corners       #
#################################

corner-radius = 13;

#################################
#              Blur             #
#################################

blur-strength  = 5;

#################################
#           UI / fonts          #
#################################

bold-font = "JetBrainsMono Nerd Font Bold 10";

#################################
#              Rules            #
#################################

rules = (
  # Menus / pop-ups  – square, no shadow
  {
    match         = "window_type = 'dropdown_menu' || "
                    "window_type = 'popup_menu'    || "
                    "window_type = 'menu'          || "
                    "window_type = 'utility'";
    corner-radius = 0;
    shadow        = false;
  },

  # Tooltip windows
  {
    match       = "window_type = 'tooltip'";
    fade        = false;
    shadow      = true;
    opacity     = 0.75;
    full-shadow = false;
  },

  # Dock, desktop, frame extents – don’t blur
  {
    match           = "window_type = 'dock'    || "
                      "window_type = 'desktop' || "
                      "_GTK_FRAME_EXTENTS@";
    blur-background = false;
  },

  # Generic windows – rounded & shadowed
  {
    match         = "window_type != 'dock'";
    corner-radius = 10;
  },

  # Notifications / Conky – no shadows
  {
    match  = "name = 'Notification'   || "
             "class_g = 'Conky'       || "
             "class_g ?= 'Notify-osd' || "
             "class_g = 'Cairo-clock' || "
             "_GTK_FRAME_EXTENTS@";
    shadow = false;
  },

  # App-specific transparency
  { match = "class_g = 'Rofi'";       opacity = 0.95; }
);

###########################################################################
#  pijulius-next  – animation tweaks
###########################################################################

unredir-if-possible = false;

# -------------------------------------------------------------------------
#  Global animation defaults
# -------------------------------------------------------------------------
animations                 = true;
animation-duration-close   = 0.35;
animation-duration-minimize= 0.35;

# -------------------------------------------------------------------------
#  Workspace-switch fades
# -------------------------------------------------------------------------
animations = (
    # Everything *leaving* the current workspace
    {
        triggers = ["workspace-out", "workspace-out-inverse"];
        opacity  = {
            curve    = "linear";
            duration = 0.25;
            start    = "window-raw-opacity-before";
            end      = 0;
        };
        blur-opacity   = 0;
        shadow-opacity = "opacity";
    },
    # Everything *entering* the new workspace
    {
        triggers = ["workspace-in", "workspace-in-inverse"];
        opacity  = {
            curve    = "linear";
            duration = 0.25;
            start    = 0;
            end      = "window-raw-opacity";
        };
        blur-opacity   = {
            curve    = "linear";
            duration = 0.25;
            start    = 0;
            end      = "window-raw-opacity";
        };
        shadow-opacity = "opacity";
    }
);
