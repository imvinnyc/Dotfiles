#################################
#           General             #
#################################

backend        = "glx";
vsync          = true;
use-damage     = true;

# Experimental animations
animations               = true;
animation-stiffness      = 120;
animation-window-mass    = 0.8;

#################################
#   Shadows / Opacity / Corners #
#################################

shadow          = true;
shadow-radius   = 12;
shadow-opacity  = 0.75;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-color    = "#000000";
crop-shadow-to-monitor = false;

frame-opacity       = 0.90;
inactive-dim-fixed  = true;

corner-radius = 13;

#################################
#              Blur             #
#################################

blur-strength  = 5;

#################################
#           UI / fonts          #
#################################

bold-font = "JetBrainsMono Nerd Font Bold 10";

#################################
#              Rules            #
#################################

rules = (
  # ───── Generic visual tweaks ─────────────────────────────────────────
  { match = "window_type = 'dropdown_menu' || window_type = 'popup_menu'  \
             || window_type = 'menu' || window_type = 'utility'";
    corner-radius = 0;  shadow = false; },

  { match = "window_type = 'tooltip'";
    fade = false;  shadow = true;  opacity = 0.75;  full-shadow = false; },

  { match = "window_type = 'dock' || window_type = 'desktop'             \
             || _GTK_FRAME_EXTENTS@";
    blur-background = false; },

  { match = "window_type != 'dock'";  corner-radius = 13; },

  { match = "name = 'Notification' || class_g = 'Conky'                  \
             || class_g ?= 'Notify-osd' || class_g = 'Cairo-clock'       \
             || _GTK_FRAME_EXTENTS@";
    shadow = false; },

  # App-specific transparency
  { match = "class_g ?= 'rofi'";  opacity = 0.95; },

  # ───── Window-specific animation helpers ─────────────────────────────
  { match = "WM_TRANSIENT_FOR@";
    animations = ({
        triggers = ["open", "show"];
        opacity = { curve = "linear"; duration = 0.15;
                    start = "window-raw-opacity-before";
                    end   = "window-raw-opacity"; };
        blur-opacity   = { curve = "linear"; duration = 0.10; delay = 0.15;
                           start = "window-raw-opacity-before";
                           end   = "window-raw-opacity"; };
        shadow-opacity = "opacity";
        scale-y = { curve = "cubic-bezier(0.24,0.64,0.79,0.98)";
                    duration = 0.15; start = 0.8; end = 1; };
        offset-y       = "(-window-height/2) + (window-height/2) * scale-y";
        shadow-scale-y = "scale-y";
        shadow-offset-y= "offset-y";
      },{
        triggers = ["close", "hide"];
        opacity = { curve = "linear"; duration = 0.15;
                    start = "window-raw-opacity-before"; end = 0; };
        blur-opacity   = 0;
        shadow-opacity = "opacity";
        scale-y = { curve = "cubic-bezier(0.21,0.02,0.76,0.36)";
                    duration = 0.15; start = 1; end = 0.7; };
        offset-y       = "(-window-height/2) + (window-height/2) * scale-y";
        shadow-scale-y = "scale-y";
        shadow-offset-y= "offset-y";
    }); },

  { match = "window_type = 'dropdown_menu' || window_type = 'popup_menu' \
             || window_type = 'menu'";
    opacity = 0.9;
    animations = ({
        triggers = ["open", "show"];
        opacity = { curve = "linear"; duration = 0.15;
                    start = "window-raw-opacity-before";
                    end   = "window-raw-opacity"; };
        blur-opacity = { curve = "linear"; duration = 0.10; delay = 0.15;
                         start = "window-raw-opacity-before";
                         end   = "window-raw-opacity"; };
        shadow-opacity = "opacity";
        scale-y = { curve = "cubic-bezier(0.24,0.64,0.79,0.98)";
                    duration = 0.15; start = 0.8; end = 1; };
        shadow-scale-y = "scale-y";
      },{
        triggers = ["close", "hide"];
        opacity = { curve = "linear"; duration = 0.15;
                    start = "window-raw-opacity-before"; end = 0; };
        blur-opacity   = 0;
        shadow-opacity = "opacity";
        scale-y = { curve = "cubic-bezier(0.21,0.02,0.76,0.36)";
                    duration = 0.15; start = 1; end = 0.7; };
        shadow-scale-y = "scale-y";
    }); },

  { match = "window_type = 'dock' || window_type = 'desktop'";
    blur-background = false;  corner-radius = 0; },

  { match = "class_g *= 'i3lock' || _NET_WM_STATE@[1] = '_NET_WM_STATE_FULLSCREEN' \
             || _NET_WM_STATE@[2] = '_NET_WM_STATE_FULLSCREEN'                      \
             || _NET_WM_STATE@[3] = '_NET_WM_STATE_FULLSCREEN'                      \
             || _NET_WM_STATE@[4] = '_NET_WM_STATE_FULLSCREEN'";
    shadow = false;  corner-radius = 0;
    animations = ({
        triggers = ["open", "show"];
        opacity = { curve = "linear"; duration = 0.15;
                    start = "window-raw-opacity-before";
                    end   = "window-raw-opacity"; };
        blur-opacity = { curve = "linear"; duration = 0.10; delay = 0.15;
                         start = "window-raw-opacity-before";
                         end   = "window-raw-opacity"; };
        shadow-opacity = "opacity";
      },{
        triggers = ["close", "hide"];
        opacity = { curve = "linear"; duration = 0.15;
                    start = "window-raw-opacity-before"; end = 0; };
        blur-opacity   = 0;
        shadow-opacity = "opacity";
    }); }
);

###########################################################################
#  Global animation tables – workspace & open/close                       #
###########################################################################

unredir-if-possible = false;

animations                 = true;
animation-duration-close   = 0.35;
animation-duration-minimize= 0.35;

animations = (
  # Window open / close -------------------------------------------------
  {
    triggers = ["close", "hide"];
    opacity  = { curve = "linear"; duration = 0.15;
                 start = "window-raw-opacity-before";
                 end   = "window-raw-opacity"; };
    blur-opacity   = 0;
    shadow-opacity = "opacity";
    offset-x       = "(1 - scale-x) / 2 * window-width";
    offset-y       = "(1 - scale-y) / 2 * window-height * 5";
    scale-x = { curve = "cubic-bezier(0.21,0.02,0.76,0.36)";
                duration = 0.15; start = 1; end = 0.9; };
    scale-y               = "scale-x";
    shadow-scale-x        = "scale-x";
    shadow-scale-y        = "scale-y";
    shadow-offset-x       = "offset-x";
    shadow-offset-y       = "offset-y";
  },{
    triggers = ["open", "show"];
    opacity  = { curve = "linear"; duration = 0.15;
                 start = "window-raw-opacity-before";
                 end   = "window-raw-opacity"; };
    blur-opacity = { curve = "linear"; duration = 0.10; delay = 0.15;
                     start = "window-raw-opacity-before";
                     end   = "window-raw-opacity"; };
    shadow-opacity        = "opacity";
    offset-x              = "(1 - scale-x) / 2 * window-width";
    offset-y              = "(1 - scale-y) / 2 * window-height * 5";
    scale-x = { curve = "cubic-bezier(0.24,0.64,0.79,0.98)";
                duration = 0.15; start = 0.95; end = 1; };
    scale-y               = "scale-x";
    shadow-scale-x        = "scale-x";
    shadow-scale-y        = "scale-y";
    shadow-offset-x       = "offset-x";
    shadow-offset-y       = "offset-y";
  },

  # Half-window-height workspace switch ---------------------------------
  {
    triggers = ["workspace-out"];
    offset-y = { curve = "cubic-bezier(0.21,0.02,0.76,0.36)";
                 duration = 0.15; start = 0; end = "- window-height / 2"; };
    shadow-offset-y       = "offset-y";
    opacity  = { curve = "linear"; duration = 0.15;
                 start = "window-raw-opacity-before";
                 end   = "window-raw-opacity"; };
    blur-opacity          = 0;
    shadow-opacity        = "opacity";
  },{
    triggers = ["workspace-out-inverse"];
    offset-y = { curve = "cubic-bezier(0.21,0.02,0.76,0.36)";
                 duration = 0.15; start = 0; end = "window-height / 2"; };
    shadow-offset-y       = "offset-y";
    opacity  = { curve = "linear"; duration = 0.15;
                 start = "window-raw-opacity-before";
                 end   = "window-raw-opacity"; };
    blur-opacity          = 0;
    shadow-opacity        = "opacity";
  },{
    triggers = ["workspace-in"];
    offset-y = { curve = "cubic-bezier(0.24,0.64,0.79,0.98)";
                 duration = 0.15; start = "window-height / 2"; end = 0; };
    shadow-offset-y       = "offset-y";
    opacity  = { curve = "linear"; duration = 0.15; start = 0;
                 end   = "window-raw-opacity"; };
    blur-opacity = { curve = "linear"; duration = 0.10; delay = 0.15;
                     start = 0; end = "window-raw-opacity"; };
    shadow-opacity        = "opacity";
  },{
    triggers = ["workspace-in-inverse"];
    offset-y = { curve = "cubic-bezier(0.24,0.64,0.79,0.98)";
                 duration = 0.15; start = "- window-height / 2"; end = 0; };
    shadow-offset-y       = "offset-y";
    opacity  = { curve = "linear"; duration = 0.15; start = 0;
                 end   = "window-raw-opacity"; };
    blur-opacity = { curve = "linear"; duration = 0.10; delay = 0.15;
                     start = 0; end = "window-raw-opacity"; };
    shadow-opacity        = "opacity";
  },

  # React to geometry changes -------------------------------------------
  { triggers = ["geometry"];  preset = "geometry-change"; }
);

